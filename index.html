<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Desk</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='3' y='4' width='18' height='17' rx='4' fill='%234f46e5'/%3E%3Crect x='7' y='9' width='10' height='2' rx='1' fill='white'/%3E%3Crect x='7' y='13' width='6' height='2' rx='1' fill='white' opacity='.7'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  :root{
    --bg:#f2f4f7;--surface:#fff;--surface-2:#f8fafc;--line:#e4e8ee;--line-strong:#d3d9e2;
    --ink:#14171d;--ink-2:#434a55;--muted:#79828f;
    --accent:#4f46e5;--accent-soft:#eef0fe;--accent-ink:#3730a3;
    --urgent:#dc2626;--urgent-soft:#fdecec;--soon:#c2700a;--soon-soft:#fdf1e1;--safe:#0f8a5f;--safe-soft:#e6f6ef;
    --sat:#2563eb;--sun:#dc2626;
    --shadow-sm:0 1px 2px rgba(20,23,29,.06);--shadow-md:0 6px 24px -12px rgba(20,23,29,.28);
    --radius:14px;--radius-sm:9px;
    --sans:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
    --bg:#101318;--surface:#191d24;--surface-2:#1f242c;--line:#2a303a;--line-strong:#363d49;
    --ink:#e9edf3;--ink-2:#b3bcc9;--muted:#7d8794;--accent:#8b83ff;--accent-soft:#241f3f;--accent-ink:#b9b3ff;
    --urgent:#ff6b6b;--urgent-soft:#34181a;--soon:#eaa64d;--soon-soft:#33260f;--safe:#4cc38a;--safe-soft:#12291f;
    --sat:#6ea8ff;--sun:#ff7a7a;--shadow-sm:0 1px 2px rgba(0,0,0,.3);--shadow-md:0 8px 30px -14px rgba(0,0,0,.7);
  }}
  :root[data-theme="dark"]{
    --bg:#101318;--surface:#191d24;--surface-2:#1f242c;--line:#2a303a;--line-strong:#363d49;
    --ink:#e9edf3;--ink-2:#b3bcc9;--muted:#7d8794;--accent:#8b83ff;--accent-soft:#241f3f;--accent-ink:#b9b3ff;
    --urgent:#ff6b6b;--urgent-soft:#34181a;--soon:#eaa64d;--soon-soft:#33260f;--safe:#4cc38a;--safe-soft:#12291f;
    --sat:#6ea8ff;--sun:#ff7a7a;--shadow-sm:0 1px 2px rgba(0,0,0,.3);--shadow-md:0 8px 30px -14px rgba(0,0,0,.7);
  }

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
  h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em}
  button{font-family:inherit;cursor:pointer;color:inherit}
  input,select,textarea{font-family:inherit;color:inherit}
  a{color:inherit}
  [hidden]{display:none!important}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .wrap{max-width:1100px;margin:0 auto;padding:20px 20px 60px}

  /* header */
  header.app{margin-bottom:18px}
  .top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
  .brand{display:flex;flex-direction:column;gap:2px}
  .brand .kicker{font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
  .brand h1{font-size:clamp(21px,3.5vw,26px)}
  .brand .today{font-family:var(--mono);font-size:12.5px;color:var(--muted)}
  .top-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .nav{display:flex;flex-wrap:wrap;gap:3px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:4px;margin-top:16px;box-shadow:var(--shadow-sm)}
  .nav button{border:none;background:none;padding:8px 14px;border-radius:8px;font-size:13.5px;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;gap:7px;transition:.12s}
  .nav button:hover{color:var(--ink)}
  .nav button.active{background:var(--accent-soft);color:var(--accent-ink)}
  .nav button .cdot{width:7px;height:7px;border-radius:50%;display:inline-block}
  .nav button .badge{font-family:var(--mono);font-size:10px;background:var(--urgent);color:#fff;border-radius:999px;padding:0 5px;line-height:15px;min-width:15px;text-align:center}

  .btn{border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);border-radius:var(--radius-sm);padding:8px 13px;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px;transition:.12s;white-space:nowrap}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover{filter:brightness(1.07);color:#fff}
  .btn.danger{color:var(--urgent);border-color:var(--urgent)}
  .btn.ghost{border-color:transparent;background:transparent;color:var(--muted);padding:6px 8px}
  .btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
  .btn.icon{padding:7px}
  .btn.sm{padding:5px 10px;font-size:12px}
  .btn svg{width:15px;height:15px;flex:none}

  section.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm);overflow:hidden}
  .panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line)}
  .panel-head h2{font-size:15px;display:flex;align-items:center;gap:8px}
  .panel-head .count{font-family:var(--mono);font-size:12px;color:var(--muted)}
  .panel-body{padding:14px 16px}
  .col{display:flex;flex-direction:column;gap:18px;min-width:0}
  .home-grid{display:grid;grid-template-columns:1.55fr 1fr;gap:18px;align-items:start;margin-bottom:18px}
  .home-grid.two{grid-template-columns:1fr 1fr}
  .cal-top{flex-wrap:wrap} .cal-nav{flex-wrap:wrap;justify-content:flex-end} .cal-title{white-space:nowrap}
  .seg button{white-space:nowrap}
  .panel-empty{color:var(--muted);font-size:13.5px;text-align:center;padding:22px 10px}

  /* calendar */
  .cal-top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
  .cal-title{font-family:var(--mono);font-size:16px;font-weight:600}
  .cal-nav{display:flex;gap:5px;align-items:center}
  .cal-nav .btn{padding:6px 9px}
  .cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;padding:10px 12px 12px}
  .cal-wd{text-align:center;font-size:11px;color:var(--muted);font-weight:600;padding:2px 0 4px}
  .cal-wd.sun{color:var(--sun)} .cal-wd.sat{color:var(--sat)}
  .cal-cell{min-height:74px;border-radius:8px;border:1.5px solid transparent;padding:4px 4px 4px;background:var(--surface-2);display:flex;flex-direction:column;gap:2px;text-align:left;transition:.1s;min-width:0;overflow:hidden}
  .cal-cell:hover{border-color:var(--line-strong)}
  .cal-cell.other{opacity:.4}
  .cal-cell .cn-row{display:flex;align-items:center;gap:4px;min-width:0}
  .cal-cell .cn{font-family:var(--mono);font-size:12px;color:var(--ink-2);flex:none}
  .cal-cell.sun .cn,.cal-cell.holiday .cn{color:var(--sun)} .cal-cell.sat .cn{color:var(--sat)}
  .cal-cell.today .cn{color:#fff;background:var(--accent);border-radius:999px;width:20px;height:20px;display:grid;place-items:center;font-weight:600}
  .cal-cell.sel{border-color:var(--accent);background:var(--accent-soft)}
  .cal-hol{font-size:9.5px;line-height:1.1;color:var(--sun);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;font-weight:500}
  .pill{font-size:10.5px;line-height:1.35;padding:1px 5px;border-radius:4px;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500;background:var(--pc,var(--accent))}
  .pill.cont-l{border-top-left-radius:0;border-bottom-left-radius:0;margin-left:-5px;padding-left:5px}
  .pill.cont-r{border-top-right-radius:0;border-bottom-right-radius:0;margin-right:-5px}
  .pill.done{opacity:.45;text-decoration:line-through}
  .pill.todo{background:var(--surface);color:var(--pc,var(--accent));border:1px solid var(--pc,var(--accent));padding-top:0;padding-bottom:0}
  .pill.more{background:transparent;color:var(--muted);font-family:var(--mono);padding-left:2px}
  .cal-legend{display:flex;flex-wrap:wrap;gap:12px;padding:0 16px 12px;font-size:11.5px;color:var(--muted)}
  .cal-legend span{display:inline-flex;align-items:center;gap:5px}
  .cal-legend i{width:9px;height:9px;border-radius:50%;display:inline-block}

  /* d-day card */
  .dday-card{background:linear-gradient(135deg,var(--accent),#6d63ff);color:#fff;border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow-sm);cursor:pointer;border:none;text-align:left;width:100%;font-family:inherit}
  .dday-card .lbl{font-size:12px;opacity:.85;font-weight:500}
  .dday-card .dd{font-family:var(--mono);font-size:38px;font-weight:600;line-height:1.05;margin:4px 0 2px;letter-spacing:-.02em}
  .dday-card .nm{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dday-card .dt{font-family:var(--mono);font-size:12px;opacity:.85;margin-top:2px}
  .dday-card.none{background:var(--surface);color:var(--muted);border:1px solid var(--line)}
  .dday-card.none .dd{font-size:20px;color:var(--ink)}

  /* day detail */
  .daydetail .dh{font-size:13px;font-weight:600;margin-bottom:10px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .daydetail .dh .rel{font-family:var(--mono);font-size:11px;color:var(--accent);font-weight:600}
  .daydetail .dh .hol{font-size:11.5px;color:var(--sun);font-weight:500}
  .items{display:flex;flex-direction:column;gap:6px}
  .row{display:flex;align-items:center;gap:10px;padding:8px 9px;border:1px solid var(--line);border-radius:9px;background:var(--surface-2);min-width:0}
  .row .main{flex:1;min-width:0}
  .row .t{font-size:13.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row.done .t{text-decoration:line-through;color:var(--muted)}
  .row .m{font-size:11.5px;color:var(--muted);margin-top:1px;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
  .row .m .tm{font-family:var(--mono)}
  .row .note{font-size:12px;color:var(--ink-2);margin-top:4px;white-space:pre-wrap;line-height:1.45}
  .row .acts{display:flex;gap:1px;flex:none}
  .row .acts button{border:none;background:none;color:var(--muted);padding:4px;display:inline-flex;border-radius:6px;opacity:.55;transition:.12s}
  .row:hover .acts button{opacity:1}
  .row .acts button:hover{color:var(--accent);background:var(--surface)}
  .row .acts button.del:hover{color:var(--urgent)}
  .row .acts svg{width:14px;height:14px}
  .check{width:20px;height:20px;border-radius:6px;border:1.6px solid var(--line-strong);background:var(--surface);flex:none;display:grid;place-items:center;transition:.12s;padding:0}
  .check:hover{border-color:var(--accent)}
  .check svg{width:12px;height:12px;opacity:0;color:#fff}
  .row.done .check{background:var(--safe);border-color:var(--safe)} .row.done .check svg{opacity:1}
  .check.ev{border-radius:50%;border-style:dashed;pointer-events:none}
  .cat-chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:1px 8px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
  .cat-chip .cdot{width:7px;height:7px;border-radius:50%}
  .dm{font-family:var(--mono);font-weight:600;font-size:12px;padding:2px 8px;border-radius:6px;white-space:nowrap;flex:none}
  .dm.urgent{background:var(--urgent-soft);color:var(--urgent)} .dm.soon{background:var(--soon-soft);color:var(--soon)}
  .dm.safe{background:var(--safe-soft);color:var(--safe)} .dm.past{background:var(--surface-2);color:var(--muted)}
  .badge2{font-family:var(--mono);font-size:10px;font-weight:600;padding:1px 6px;border-radius:5px;letter-spacing:.03em;flex:none}
  .badge2.rp{background:var(--accent-soft);color:var(--accent-ink)}
  .badge2.pin{background:var(--soon-soft);color:var(--soon)}

  /* stats */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow-sm)}
  .stat .lbl{font-size:12px;color:var(--muted);font-weight:500}
  .stat .val{font-family:var(--mono);font-size:26px;font-weight:600;line-height:1.1;margin-top:6px;letter-spacing:-.02em}
  .stat .val.warn{color:var(--urgent)}
  .stat .sub{font-size:12px;color:var(--ink-2);margin-top:3px}

  /* agenda (grouped by day) */
  .agenda{display:flex;flex-direction:column}
  .day{display:grid;grid-template-columns:84px 1fr;gap:14px;padding:12px 0;border-top:1px solid var(--line)}
  .day:first-child{border-top:none;padding-top:2px}
  .day .date{display:flex;flex-direction:column;gap:1px}
  .day .date .d{font-family:var(--mono);font-size:15px;font-weight:600}
  .day.is-today .date .d{color:var(--accent)}
  .day .date .wd{font-size:12px;color:var(--muted)}
  .day .date .wd.sun{color:var(--sun)} .day .date .wd.sat{color:var(--sat)}
  .day .date .rel{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:2px}

  /* list tab */
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
  .toolbar input[type=search]{flex:1;min-width:160px;border:1px solid var(--line-strong);background:var(--surface-2);border-radius:8px;padding:7px 10px;font-size:13px}
  .toolbar select{border:1px solid var(--line-strong);background:var(--surface-2);border-radius:8px;padding:7px 9px;font-size:13px}
  .seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden}
  .seg button{border:none;background:var(--surface);padding:6px 11px;font-size:12.5px;font-weight:500;color:var(--muted)}
  .seg button.active{background:var(--accent-soft);color:var(--accent-ink)}
  .group-h{font-size:12px;font-weight:600;color:var(--muted);margin:14px 0 6px;letter-spacing:.04em;text-transform:uppercase;font-family:var(--mono)}
  .group-h:first-child{margin-top:0}

  /* modal */
  .scrim{position:fixed;inset:0;background:rgba(15,18,24,.5);backdrop-filter:blur(2px);display:none;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:60;overflow-y:auto}
  .scrim.open{display:flex}
  .modal{background:var(--surface);border-radius:var(--radius);width:100%;max-width:520px;box-shadow:var(--shadow-md);border:1px solid var(--line);animation:pop .16s ease}
  @keyframes pop{from{transform:translateY(8px) scale(.98);opacity:0}}
  @media (prefers-reduced-motion:reduce){.modal{animation:none}}
  .modal-head{display:flex;align-items:center;justify-content:space-between;padding:15px 18px;border-bottom:1px solid var(--line)} .modal-head h3{font-size:16px}
  .modal-body{padding:18px;display:flex;flex-direction:column;gap:13px}
  .modal-foot{display:flex;justify-content:space-between;gap:8px;padding:14px 18px;border-top:1px solid var(--line)}
  .modal-foot .r{display:flex;gap:8px;margin-left:auto}
  .field{display:flex;flex-direction:column;gap:5px;min-width:0}
  .field label{font-size:12.5px;font-weight:500;color:var(--ink-2)}
  .field .hint{font-size:11.5px;color:var(--muted);font-weight:400}
  .field input,.field select,.field textarea{border:1px solid var(--line-strong);background:var(--surface-2);border-radius:8px;padding:9px 11px;font-size:14px;width:100%;min-width:0}
  .field textarea{resize:vertical;min-height:60px;line-height:1.5}
  .field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
  .chk{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2)}
  .chk input{width:16px;height:16px;accent-color:var(--accent)}
  .cat-edit{display:flex;gap:6px;align-items:center;border-radius:9px;padding:3px;margin:-3px;transition:background .12s,opacity .12s}
  .cat-edit.dragging{opacity:.35}
  .cat-edit.over{background:var(--accent-soft);box-shadow:inset 0 2px 0 var(--accent)}
  .cat-edit.over.below{box-shadow:inset 0 -2px 0 var(--accent)}
  .cat-edit .handle{border:none;background:none;color:var(--muted);padding:6px 3px;display:inline-flex;cursor:grab;touch-action:none;flex:none}
  .cat-edit .handle:active{cursor:grabbing}
  .cat-edit .handle svg{width:14px;height:14px}
  .cat-edit .mv{display:flex;flex-direction:column;flex:none}
  .cat-edit .mv button{border:none;background:none;color:var(--muted);padding:0 4px;line-height:1;display:inline-flex;border-radius:4px}
  .cat-edit .mv button:hover{color:var(--accent);background:var(--surface-2)} .cat-edit .mv button:disabled{opacity:.3;cursor:default}
  .cat-edit .mv svg{width:12px;height:12px}
  .cat-item{border-radius:9px;transition:background .12s,opacity .12s}
  .cat-item.dragging{opacity:.35}
  .cat-item.over{background:var(--accent-soft);box-shadow:inset 0 2px 0 var(--accent)}
  .cat-item.over.below{box-shadow:inset 0 -2px 0 var(--accent)}
  .sub-toggle{border:1px solid var(--line-strong);background:var(--surface-2);color:var(--muted);border-radius:999px;padding:3px 9px;font-size:11.5px;font-weight:600;white-space:nowrap;flex:none}
  .sub-toggle.open,.sub-toggle:hover{color:var(--accent-ink);background:var(--accent-soft);border-color:transparent}
  .sub-block{display:flex;flex-direction:column;gap:6px;margin:6px 0 4px 30px;padding-left:10px;border-left:2px solid var(--line)}
  .sub-edit{display:flex;gap:6px;align-items:center}
  .sub-edit input[type=text]{flex:1;padding:6px 9px;font-size:13px}
  .sub-edit input[type=color]{width:30px;height:30px;padding:2px;border:1px solid var(--line-strong);border-radius:7px;background:var(--surface-2)}
  .sub-edit .mv{display:flex;flex-direction:column;flex:none} .sub-edit .mv button{border:none;background:none;color:var(--muted);padding:0 4px;line-height:1;display:inline-flex;border-radius:4px} .sub-edit .mv button:disabled{opacity:.3;cursor:default} .sub-edit .mv svg{width:11px;height:11px}
  .sub-edit .rm{border:none;background:none;color:var(--muted);padding:5px;display:inline-flex} .sub-edit .rm:hover{color:var(--urgent)} .sub-edit .rm svg{width:14px;height:14px}
  .cat-chip.sub{color:var(--sc)}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:12px;font-weight:500;color:var(--muted);display:inline-flex;align-items:center;gap:6px;transition:.12s}
  .chip .cdot{width:7px;height:7px;border-radius:50%} .chip .n{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
  .chip:hover{color:var(--ink);border-color:var(--accent)}
  .chip.active{background:var(--accent-soft);color:var(--accent-ink);border-color:transparent} .chip.active .n{color:var(--accent-ink)}
  .group-h.sub-h{display:flex;align-items:center;gap:7px;text-transform:none;font-family:var(--sans);font-size:12.5px;color:var(--ink-2)} .group-h.sub-h .cdot{width:8px;height:8px;border-radius:50%}
  .cat-edit input[type=text]{flex:1}
  .cat-edit input[type=color]{width:38px;height:36px;padding:2px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface-2)}
  .cat-edit .rm{border:none;background:none;color:var(--muted);padding:6px;display:inline-flex} .cat-edit .rm:hover{color:var(--urgent)}
  .cat-edit .rm svg{width:15px;height:15px}
  .add-link{font-size:12.5px;color:var(--accent);background:none;border:none;padding:2px 0;display:inline-flex;align-items:center;gap:5px;align-self:flex-start}

  // task: {id,title,cat,kind:'todo'|'event',start,end,allDay,startTime,endTime,repeat,repeatUntil,note,pin,done,doneDates}

  /* ===== 타임라인(간트) ===== */
  function renderTimeline(host,catId,sub){
    var from=ui.tlFrom, span=ui.tlSpan, to=addDays(from,span-1), today=todayKey();
    var dw=span<=60?18:span<=120?10:5, LW=window.innerWidth<560?110:170, RH=24, PAD=6;
    var c=catOf(catId);
    var occs=occsInRange(from,to,catId,sub).filter(function(o){ return ui.tlRepeat||!(o.t.repeat&&o.t.repeat!=="none"); });
    var lanes;
    if((c.subs||[]).length&&!(sub&&sub!=="none")){
      lanes=c.subs.map(function(x){ return {key:x.id,label:x.label,color:x.color||c.color,items:[]}; }).concat([{key:"",label:"과제 없음",color:c.color,items:[]}]);
      occs.forEach(function(o){ for(var i=0;i<lanes.length;i++) if(lanes[i].key===(o.t.sub||"")){ lanes[i].items.push(o); return; } });
      lanes=lanes.filter(function(l){ return l.items.length||l.key!==""; });
    } else {
      var byTask={}, order=[];
      occs.forEach(function(o){ if(!byTask[o.t.id]){ byTask[o.t.id]={key:o.t.id,label:o.t.title,color:itemColor(o.t),items:[]}; order.push(o.t.id); } byTask[o.t.id].items.push(o); });
      lanes=order.map(function(id){ return byTask[id]; }).sort(function(a,b){ return a.items[0].start<b.items[0].start?-1:a.items[0].start>b.items[0].start?1:0; });
    }
    // 겹치는 막대는 아래 줄로 내리기
    lanes.forEach(function(l){ l.items.sort(function(a,b){ return a.start<b.start?-1:a.start>b.start?1:0; }); var ends=[]; l.items.forEach(function(o){ var r=-1; for(var i=0;i<ends.length;i++) if(ends[i]<o.start){ r=i; break; } if(r<0){ r=ends.length; ends.push(o.end); } else ends[r]=o.end; o.row=r; }); l.rows=Math.max(1,ends.length); });
    var W=LW+span*dw, months=[], days="", shade="", k=from, curM=from.slice(0,7), mstart=0;
    for(var i=0;i<span;i++){
      var mm=k.slice(0,7); if(mm!==curM){ months.push({m:curM,x:mstart,w:i-mstart}); curM=mm; mstart=i; }
      var d=parseKey(k), wd=d.getDay(), hol=holidayName(k), x=LW+i*dw;
      if(dw>=14) days+='<div class="tl-day'+(wd===0||hol?" sun":wd===6?" sat":"")+(k===today?" today":"")+'" style="left:'+x+'px;width:'+dw+'px" title="'+k+(hol?" "+hol:"")+'">'+d.getDate()+'</div>';
      else if(wd===1) days+='<div class="tl-day wk" style="left:'+x+'px;width:'+(7*dw)+'px">'+(d.getMonth()+1)+'/'+d.getDate()+'</div>';
      if(wd===0||wd===6||hol) shade+='<div class="tl-shade'+(hol?" hol":"")+'" style="left:'+x+'px;width:'+dw+'px"'+(hol?' title="'+esc(hol)+'"':"")+'></div>';
      k=addDays(k,1);
    }
    months.push({m:curM,x:mstart,w:span-mstart});
    var head='<div class="tl-months"><div class="tl-corner" style="width:'+LW+'px">'+esc(c.label)+'</div>'+months.map(function(m){ return '<div class="tl-month" style="left:'+(LW+m.x*dw)+'px;width:'+(m.w*dw)+'px">'+(+m.m.slice(0,4))+'년 '+(+m.m.slice(5))+'월</div>'; }).join("")+'</div>'+
      '<div class="tl-days"><div class="tl-corner" style="width:'+LW+'px"></div>'+days+'</div>';
    var todayX=(today>=from&&today<=to)?LW+diffDays(from,today)*dw:-1;
    var body=lanes.map(function(l){
      var h=l.rows*RH+PAD*2;
      var bars=l.items.map(function(o){
        var st=o.start<from?from:o.start, en=o.end>to?to:o.end;
        var bx=LW+diffDays(from,st)*dw, bw=Math.max((diffDays(st,en)+1)*dw-2,dw-2);
        return '<button type="button" class="tl-bar'+(o.t.kind!=="event"?" todo":"")+(occDone(o)?" done":"")+(o.start<from?" cut-l":"")+(o.end>to?" cut-r":"")+'" style="left:'+bx+'px;width:'+bw+'px;top:'+(PAD+o.row*RH)+'px;--pc:'+itemColor(o.t)+'" data-action="edit-task" data-id="'+o.t.id+'" title="'+esc(o.t.title)+' · '+fmtRange(o.start,o.end)+'">'+esc(o.t.title)+'</button>';
      }).join("");
      return '<div class="tl-lane" style="height:'+h+'px"><div class="tl-label" style="width:'+LW+'px"><span class="cdot" style="background:'+l.color+'"></span><span class="tl-lt" title="'+esc(l.label)+'">'+esc(l.label)+'</span><span class="n">'+l.items.length+'</span></div>'+bars+'</div>';
    }).join("");
    host.innerHTML='<div class="tl-scroll"><div class="tl-wrap" style="width:'+W+'px"><div class="tl-bg">'+shade+(todayX>=0?'<div class="tl-today" style="left:'+(todayX+Math.floor(dw/2))+'px"></div>':"")+'</div>'+head+(lanes.length?body:'<div class="tl-empty" style="width:'+Math.min(W,520)+'px">이 기간에 표시할 일정이 없어요.'+(ui.tlRepeat?"":" 반복 일정은 위의 \"반복\" 버튼으로 켤 수 있어요.")+'</div>')+'</div></div>';
    // 오늘이 보이도록 스크롤
    var sc=host.querySelector(".tl-scroll"); if(sc&&todayX>=0){ sc.scrollLeft=Math.max(0,todayX-LW-Math.min(sc.clientWidth-LW,300)/2); }
  }

  function renderList(){
    var sel=$("fCat"); sel.innerHTML='<option value="">모든 카테고리</option>'+state.cats.map(function(c){ var o='<option value="'+c.id+'"'+(ui.listCat===c.id?" selected":"")+'>'+esc(c.label)+'</option>'; (c.subs||[]).forEach(function(x){ var v=c.id+"|"+x.id; o+='<option value="'+v+'"'+(ui.listCat===v?" selected":"")+'>&nbsp;&nbsp;› '+esc(x.label)+'</option>'; }); return o; }).join("");

    $("q").value=ui.q;
    var q=ui.q.trim().toLowerCase(), today=todayKey();
    var tasks=allTasks().filter(function(t){
      if(ui.listCat){ var fp=ui.listCat.split("|"); if(t.cat!==fp[0]) return false; if(fp[1]&&(t.sub||"")!==fp[1]) return false; }
      if(q&&!((t.title||"").toLowerCase().indexOf(q)>=0||(t.note||"").toLowerCase().indexOf(q)>=0)) return false;
      return true;
    });
    // 각 task를 대표 발생 1개로 표현: 미완료 다음 발생, 없으면 마지막 발생
    var rows=[];
    tasks.forEach(function(t){
      var o=nextOccOf(t,today);
      var isOpen=!!o;
      if(!o){ var os=occurrences(t,addDays(today,-3650),addDays(today,3650)); o=os[os.length-1]||{t:t,start:t.start,end:taskEnd(t),key:t.start}; }
      if(ui.listStatus==="open"&&!isOpen) return;
      if(ui.listStatus==="done"&&isOpen) return;
      rows.push({o:o,open:isOpen});
    });
    rows.sort(function(a,b){ return a.o.end<b.o.end?-1:a.o.end>b.o.end?1:occSort(a.o,b.o); });
    if(!rows.length){ $("listBody").innerHTML='<div class="panel-empty">'+(q?"검색 결과가 없어요.":"표시할 일정이 없어요.")+'</div>'; return; }
    var groups=[{h:"지난 · 미완료",f:function(r){ return r.open&&r.o.end<today; }},{h:"오늘",f:function(r){ return r.open&&r.o.start<=today&&r.o.end>=today; }},{h:"예정",f:function(r){ return r.open&&r.o.start>today; }},{h:"완료 · 지난 일정",f:function(r){ return !r.open; }}];
    var html="";
    groups.forEach(function(g){ var rs=rows.filter(g.f); if(!rs.length) return; html+='<div class="group-h">'+g.h+' · '+rs.length+'</div><div class="items">'+rs.map(function(r){ return occRow(r.o,{dday:r.open,showDate:true,note:true}); }).join("")+'</div>'; });
    $("listBody").innerHTML=html;
  }

    var n=currentNote();
    $("noteTitle").disabled=!n; $("memoEdit").disabled=!n; $("noteDelete").disabled=!n;
    if(!n){ $("noteTitle").value=""; $("memoEdit").value=""; $("memoView").innerHTML='<p class="memo-empty">왼쪽에서 노트를 고르거나 새로 만드세요.</p>'; }
    $("memoWrap").className="memo-wrap mode-"+ui.memoMode;
    Array.prototype.forEach.call($("memoMode").querySelectorAll("button"),function(b){ b.classList.toggle("active",b.getAttribute("data-v")===ui.memoMode); });
  }
  function openNote(id){
    ui.activeNote=id; try{ localStorage.setItem("desk_note_active",id||""); }catch(e){}
    var n=currentNote(); if(n){ $("noteTitle").value=n.title||""; $("memoEdit").value=n.body||""; $("memoView").innerHTML=mdToHtml(n.body||""); }
    renderNoteList();
  }
  function newNote(){ var id="n"+Date.now().toString(36); state.notes[id]={id:id,title:"",body:"",updated:Date.now()}; save(); openNote(id); $("noteTitle").focus(); }
  var saveTimer=null;
  function saveActiveNote(){
    var n=currentNote(); if(!n) return;
    n.title=$("noteTitle").value; n.body=$("memoEdit").value; n.updated=Date.now();
    $("memoView").innerHTML=mdToHtml(n.body);
    clearTimeout(saveTimer); saveTimer=setTimeout(function(){ save(); renderNoteList(); },400);
  }
  function initMemo(){ if(ui.activeNote&&!state.notes[ui.activeNote]) ui.activeNote=null; if(!ui.activeNote){ var f=noteOrder()[0]; ui.activeNote=f?f.id:null; } openNote(ui.activeNote); }

  /* ===== 이벤트 ===== */
  function toast(msg,undo){ var t=$("toast"); t.innerHTML='<span>'+esc(msg)+'</span>'+(undo?'<button type="button" class="toast-undo">되돌리기</button>':""); if(undo) t.querySelector(".toast-undo").addEventListener("click",function(){ t.classList.remove("show"); undo(); }); t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(function(){ t.classList.remove("show"); },undo?6000:1800); }
  function setTab(id){ ui.tab=id; try{ localStorage.setItem("desk_tab",id); }catch(e){} render(); if(id==="memo") initMemo(); }
  $("nav").addEventListener("click",function(e){ var b=e.target.closest("[data-tab]"); if(b) setTab(b.getAttribute("data-tab")); });
  document.addEventListener("click",function(e){
    var b=e.target.closest("[data-action]"); if(!b) return;
    var a=b.getAttribute("data-action"), id=b.getAttribute("data-id");
    if(a==="add-task") openTaskModal(null,{date:todayKey()});
    else if(a==="add-task-sel") openTaskModal(null,{date:ui.sel});
    else if(a==="add-task-cat") openTaskModal(null,{date:ui.sel,cat:b.getAttribute("data-cat"),sub:b.getAttribute("data-sub")||""});
    else if(a==="cat-sub"){ ui.catSub[b.getAttribute("data-cat")]=b.getAttribute("data-sub"); render(); }
    else if(a==="edit-task") openTaskModal(id);
    else if(a==="del-task") deleteTask(id);
    else if(a==="toggle"){ toggleOcc(id,b.getAttribute("data-key")); refreshDayModal(); }
    else if(a==="toggle-item"){ var tt=state.tasks[id], it=tt&&tt.items&&tt.items[+b.getAttribute("data-idx")]; if(it){ it.done=!it.done; save(); render(); refreshDayModal(); } }
    else if(a==="cat-view"){ ui.catView[b.getAttribute("data-cat")]=b.getAttribute("data-v"); render(); }
    else if(a==="tl-prev"){ ui.tlFrom=addDays(ui.tlFrom,-Math.round(ui.tlSpan/2)); render(); }
    else if(a==="tl-next"){ ui.tlFrom=addDays(ui.tlFrom,Math.round(ui.tlSpan/2)); render(); }
    else if(a==="tl-today"){ ui.tlFrom=addDays(todayKey(),-7); render(); }
    else if(a==="tl-repeat"){ ui.tlRepeat=!ui.tlRepeat; render(); }
    else if(a==="close-modal") closeModal();
    else if(a==="cal-prev"){ ui.ym=addMonths(ui.ym+"-01",-1).slice(0,7); render(); }
    else if(a==="cal-next"){ ui.ym=addMonths(ui.ym+"-01",1).slice(0,7); render(); }
    else if(a==="cal-today"){ ui.ym=todayKey().slice(0,7); ui.sel=todayKey(); render(); }
    else if(a==="sel-day"){ var k=b.getAttribute("data-key"); if(k===ui.sel){ openTaskModal(null,{date:k}); return; } ui.sel=k; if(k.slice(0,7)!==ui.ym) ui.ym=k.slice(0,7); render(); if(ui.tab!=="home") openDayModal(k); }
  });
  function refreshDayModal(){ if(ui.dayModalKey&&$("scrim").classList.contains("open")) openDayModal(ui.dayModalKey); }
  function openDayModal(k){
    var d=parseKey(k), hol=holidayName(k), n=diffDays(todayKey(),k), cat=ui.tab.startsWith("cat:")?ui.tab.slice(4):null;
    var items=occsOnDay(k,cat);
    openModal('<div class="modal-head"><h3>'+(d.getMonth()+1)+'월 '+d.getDate()+'일 ('+WD[d.getDay()]+') <span style="font-family:var(--mono);font-size:12px;color:var(--accent)">'+relLabel(n)+'</span>'+(hol?' <span style="font-size:12px;color:var(--sun)">'+esc(hol)+'</span>':"")+'</h3>'+CLOSE+'</div><div class="modal-body">'+
      (items.length?'<div class="items" data-sortable>'+items.map(function(o){ return occRow(o,{note:true,sortable:true}); }).join("")+'</div>':'<div class="panel-empty">이 날은 비어 있어요.</div>')+
      '<button class="btn primary" style="justify-content:center" data-action="add-task-cat" data-cat="'+(cat||"")+'">+ 이 날에 추가</button></div>');
    ui.dayModalKey=k;
  }
  $("themeBtn").addEventListener("click",function(){
    var cur=document.documentElement.getAttribute("data-theme");
    var sysDark=window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches;
    var isDark=cur?cur==="dark":sysDark; var next=isDark?"light":"dark";
    document.documentElement.setAttribute("data-theme",next); try{ localStorage.setItem("desk_theme",next); }catch(e){}
  });
  $("settingsBtn").addEventListener("click",openSettingsModal);
  $("backupBtn").addEventListener("click",openDataModal);
  document.addEventListener("change",function(e){ if(e.target&&e.target.id==="tlSpan"){ ui.tlSpan=+e.target.value; render(); } });
  $("helpBtn").addEventListener("click",openHelpModal);
  $("q").addEventListener("input",function(){ ui.q=this.value; renderListOnly(); });
  $("fCat").addEventListener("change",function(){ ui.listCat=this.value; renderListOnly(); });
  $("fStatus").addEventListener("click",function(e){ var b=e.target.closest("button"); if(!b) return; ui.listStatus=b.getAttribute("data-v"); renderListOnly(); });
  function renderListOnly(){ var q=$("q"), pos=q.selectionStart; renderList(); q.focus(); try{ q.setSelectionRange(pos,pos); }catch(e){} }
  $("noteNew").addEventListener("click",newNote);
  $("noteTitle").addEventListener("input",saveActiveNote);
  $("memoEdit").addEventListener("input",saveActiveNote);
  $("memoEdit").addEventListener("keydown",function(e){ if(e.key==="Tab"){ e.preventDefault(); var s=this.selectionStart,en=this.selectionEnd; this.value=this.value.slice(0,s)+"  "+this.value.slice(en); this.selectionStart=this.selectionEnd=s+2; saveActiveNote(); } });
  $("noteList").addEventListener("click",function(e){ var b=e.target.closest("[data-note]"); if(b) openNote(b.getAttribute("data-note")); });
  $("noteDelete").addEventListener("click",function(){ var n=currentNote(); if(!n) return; if(!confirm('"'+(n.title||"제목 없음")+'" 노트를 삭제할까요?')) return; delete state.notes[n.id]; save(); ui.activeNote=null; initMemo(); toast("삭제했어요"); });
  $("memoMode").addEventListener("click",function(e){ var b=e.target.closest("button"); if(!b) return; ui.memoMode=b.getAttribute("data-v"); try{ localStorage.setItem("desk_memo_mode",ui.memoMode); }catch(err){} renderNoteList(); });
  document.addEventListener("keydown",function(e){
    if(e.key==="Escape"){ if($("scrim").classList.contains("open")) closeModal(); return; }
    var tag=(e.target.tagName||"").toLowerCase(); if(tag==="input"||tag==="textarea"||tag==="select"||e.target.isContentEditable||e.metaKey||e.ctrlKey||e.altKey) return;
    if($("scrim").classList.contains("open")) return;
    if(e.key==="n"||e.key==="N"){ e.preventDefault(); openTaskModal(null,{date:ui.sel}); }
    else if(e.key==="t"||e.key==="T"){ ui.ym=todayKey().slice(0,7); ui.sel=todayKey(); render(); }
    else if(e.key==="["){ ui.ym=addMonths(ui.ym+"-01",-1).slice(0,7); render(); }
    else if(e.key==="]"){ ui.ym=addMonths(ui.ym+"-01",1).slice(0,7); render(); }
    else if(e.key==="ArrowLeft"||e.key==="ArrowRight"){ ui.sel=addDays(ui.sel,e.key==="ArrowLeft"?-1:1); ui.ym=ui.sel.slice(0,7); render(); }
    else if(e.key==="1") setTab("home"); else if(e.key==="2") setTab("list"); else if(e.key==="3") setTab("memo");
  });
  window.addEventListener("storage",function(e){ if(e.key===STORE_KEY){ load(); render(); } });

  /* ===== 시작 ===== */
  try{ var th=localStorage.getItem("desk_theme"); if(th) document.documentElement.setAttribute("data-theme",th); }catch(e){}
  load();
  render();
  if(ui.tab==="memo") initMemo();
  paintSync();
  if(syncConnected()&&sync.auto) syncNow("auto");
  // 자정 넘어가면 오늘 표시 갱신
  setInterval(function(){ var k=todayKey(); if(k!==render._day){ render._day=k; render(); } },60000); render._day=todayKey();
})();
</script>
</body>
</html>
